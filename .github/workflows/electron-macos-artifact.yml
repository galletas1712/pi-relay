name: Electron macOS release

"on":
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/electron-macos-artifact.yml"
      - "packages/electron/**"
      - "packages/web/public/icons/icon-512.png"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: electron-macos-artifact
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Electron app
        run: npm run validate --workspace @pi-relay/electron

      - name: Build universal macOS installer
        run: npm run package --workspace @pi-relay/electron -- --universal --publish never

      - name: Create DMG checksum
        shell: bash
        run: |
          set -euo pipefail
          dmg_count="$(find packages/electron/dist -type f -name '*.dmg' -print | wc -l | tr -d ' ')"
          if [[ "$dmg_count" -ne 1 ]]; then
            printf 'Expected exactly one DMG, found %s\n' "$dmg_count" >&2
            find packages/electron/dist -type f -name '*.dmg' -print >&2
            exit 1
          fi
          dmg="$(find packages/electron/dist -type f -name '*.dmg' -print -quit)"
          cp "$dmg" packages/electron/dist/pi-relay-macos.dmg
          (
            cd packages/electron/dist
            shasum -a 256 pi-relay-macos.dmg > pi-relay-macos.dmg.sha256
          )

      - name: Explain distribution limitations
        run: |
          {
            echo "## macOS release"
            echo
            echo "The DMG is an unsigned, non-notarized development artifact."
            echo "macOS Gatekeeper may warn or block the first launch; users may need to approve it in Privacy & Security or use Finder's Open action."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish rolling GitHub Release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="electron-latest"
          title="π-relay macOS (latest)"
          repo="$GITHUB_REPOSITORY"
          notes="$RUNNER_TEMP/electron-release-notes.md"

          cat > "$notes" <<EOF
          Rolling Electron macOS build.

          - Commit: \`$GITHUB_SHA\`
          - Ref: \`$GITHUB_REF\`
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Built at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          This DMG is unsigned and non-notarized. macOS Gatekeeper may warn or
          block the first launch; users may need to approve it in Privacy &
          Security or use Finder's Open action.

          This is the rolling Electron release, not a normal stable release.
          EOF

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              --latest=false
          fi

          gh release upload "$tag" \
            --repo "$repo" \
            packages/electron/dist/pi-relay-macos.dmg \
            packages/electron/dist/pi-relay-macos.dmg.sha256 \
            --clobber
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

          release_id="$(gh api \
            "repos/$repo/releases/tags/$tag" \
            --jq '.id')"
          gh api --method PATCH \
            "repos/$repo/releases/$release_id" \
            -f "name=$title" \
            -f "body=$(cat "$notes")" \
            -f "make_latest=false"

          # Keep the rolling tag aligned with the build while avoiding a git
          # push, which could trigger another workflow run.
          gh api --method PATCH \
            "repos/$repo/git/refs/tags/$tag" \
            -f "sha=$GITHUB_SHA" \
            -F force=true

      - name: Remove unexpected rolling release assets
        if: always() && steps.publish.outputs.uploaded == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="electron-latest"
          repo="$GITHUB_REPOSITORY"

          gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              case "$asset" in
                pi-relay-macos.dmg|pi-relay-macos.dmg.sha256) ;;
                *) gh release delete-asset "$tag" "$asset" --repo "$repo" --yes ;;
              esac
            done

      - name: Remove legacy rolling Actions artifacts
        if: always() && steps.publish.outputs.uploaded == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = "electron-macos-dmg";
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: artifactName,
                per_page: 100,
              },
            );

            for (const artifact of artifacts) {
              if (!artifact.expired && artifact.name === artifactName) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
