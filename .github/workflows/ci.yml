name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      # TODO: drop `-A clippy::items-after-test-module` once the helpers below
      # `mod tests` in agent-store/src/postgres/events.rs are moved above it.
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::items-after-test-module
      # PostgreSQL-backed tests stay ignored without PI_RELAY_TEST_DATABASE_URL.
      # TODO: drop the first --skip once the empty-replay case of
      # compaction_summary_requires_exactly_one_valid_compaction_replay_block is
      # fixed; it has asserted a stale invariant since before Claude Opus 5 (#304).
      # TODO: drop the second --skip once timeout_sends_cancellation_and_never_replays
      # stops asserting wall-clock deadlines; it flakes under CPU contention.
      - run: |
          cargo test --workspace -- \
            --skip compaction_summary_requires_exactly_one_valid_compaction_replay_block \
            --skip timeout_sends_cancellation_and_never_replays

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @pi-relay/web
      - run: npm test --workspaces --if-present
