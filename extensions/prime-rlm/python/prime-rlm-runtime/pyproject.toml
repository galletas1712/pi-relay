[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prime-rlm-runtime"
version = "0.1.1"
description = "Kernel-side rlm shim for the pi-relay prime-rlm extension (M1 port of prime-agent-runtime's rlm module)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/prime_rlm_runtime"]
