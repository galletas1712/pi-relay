[project]
name = "prime-harness-runtime"
version = "0.1.0"
description = "Kernel-side continual harness runtime for the pi-relay prime-harness extension (M2)"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_harness_runtime"]
